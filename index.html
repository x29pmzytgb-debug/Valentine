<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Valentine for Joy</title>
  <style>
    :root{
      --accent:#ff4d7d;
      --accent2:#ff7aa2;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f5, #ffffff);
      overflow:hidden;
    }
    .card{
      width:min(520px, 92vw);
      background:white;
      border-radius:22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      padding: 22px 18px 28px;
      text-align:center;
      position:relative;
    }
    .photo{
      width:100%;
      max-height:320px;
      object-fit:cover;
      border-radius:16px;
      margin-bottom:14px;
    }
    h1{
      font-size:28px;
      margin:10px 0 6px;
    }
    .signature{
      margin-top:6px;
      font-style:italic;
      color:#b42358;
    }
    .buttons{
      margin-top:18px;
      height:54px;
      position:relative;
    }
    button{
      border:0;
      padding:14px 24px;
      border-radius:999px;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.15);
    }
    #yesBtn{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color:white;
      margin-right:12px;
    }
    #noBtn{
      background:white;
      border:1px solid #ddd;
      position:absolute;
      left:65%;
      top:0;
      transform:translateX(-50%);
    }
    .result{
      display:none;
      margin-top:18px;
      font-size:20px;
      font-weight:600;
      color:#b42358;
    }
    canvas{
      position:fixed;
      inset:0;
      pointer-events:none;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
  <img
    class="photo"
    src="E087C287-0574-4DA7-B7A9-53640F54437A.jpeg"
    alt="Us"
  />

  <h1>Will you be my Valentine, Joy? 💘</h1>
  <div class="signature">Love, Amrik</div>

  <div class="buttons" id="btnArea">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <div class="result" id="result">
    YAY!! 💕 You just made my heart so happy 🥰
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const result = document.getElementById("result");

  noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * 70;
    const y = Math.random() * 20;
    noBtn.style.left = `${x + 20}%`;
    noBtn.style.top = `${y}px`;
  });

  // CONFETTI
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let pieces = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function confettiBurst() {
    pieces = [];
    for (let i = 0; i < 180; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 30,
        color: `hsl(${Math.random()*360},100%,70%)`
      });
    }
    requestAnimationFrame(update);
  }

  function update() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.r, p.r);
      p.y += Math.cos(p.d) + 3;
      p.x += Math.sin(p.d);
    });
    if (pieces.some(p => p.y < canvas.height)) {
      requestAnimationFrame(update);
    }
  }

  yesBtn.addEventListener("click", () => {
    result.style.display = "block";
    confettiBurst();
    yesBtn.disabled = true;
    noBtn.disabled = true;
  });
</script>

</body>
</html>
